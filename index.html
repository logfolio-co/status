<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logfolio Status</title>
    <meta name="description" content="Is Logfolio up? Checks of logfolio.co, profiles and the help center, run from outside our server." />
    <link rel="icon" href="https://logfolio.co/icon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://status.logfolio.co/" />
    <meta property="og:title" content="Logfolio Status" />
    <meta property="og:description" content="Checks of logfolio.co, run from outside our server." />
    <meta property="og:url" content="https://status.logfolio.co/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="min-h-dvh">
    <header class="border-b">
      <div class="mx-auto flex h-16 w-full max-w-3xl items-center justify-between gap-4 px-4">
        <a href="/" class="flex items-center gap-2.5 font-semibold">
          <img src="https://logfolio.co/icon.svg" alt="" width="28" height="28" class="size-7 rounded-md dark:invert" />
          <span>Logfolio Status</span>
        </a>
        <nav class="flex items-center gap-5 text-sm text-muted-foreground">
          <a href="https://logfolio.co/" class="hover:text-foreground">Logfolio</a>
          <a href="https://help.logfolio.co/" class="hover:text-foreground">Help</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto flex w-full max-w-3xl flex-col gap-8 px-4 py-10">
      <div class="flex flex-col gap-2">
        <h1 class="text-3xl font-semibold tracking-tight">Is Logfolio up?</h1>
        <p class="text-pretty text-muted-foreground">If something looks wrong and this page says it's up, email <a href="mailto:hello@logfolio.co" class="underline underline-offset-4 hover:text-foreground">hello@logfolio.co</a>.</p>
      </div>

      <section id="overall" class="flex items-center gap-3 rounded-xl border bg-card px-5 py-4" aria-live="polite">
        <span class="size-2.5 shrink-0 animate-pulse rounded-full bg-muted-foreground/40" aria-hidden="true"></span>
        <span class="font-medium">Checking…</span>
      </section>

      <section class="flex flex-col gap-3" aria-labelledby="services">
        <div class="flex items-baseline justify-between gap-4">
          <h2 id="services" class="text-lg font-semibold">Services</h2>
          <p id="updated" class="text-sm text-muted-foreground"></p>
        </div>
        <ul id="sites" class="divide-y overflow-hidden rounded-xl border bg-card">
          <li class="px-5 py-4 text-sm text-muted-foreground">Loading…</li>
        </ul>
      </section>

      <section class="flex flex-col gap-3" aria-labelledby="incidents">
        <h2 id="incidents" class="text-lg font-semibold">Past incidents</h2>
        <ul id="incident-list" class="divide-y overflow-hidden rounded-xl border bg-card">
          <li class="px-5 py-4 text-sm text-muted-foreground">Loading…</li>
        </ul>
      </section>
    </main>

    <footer class="border-t">
      <div class="mx-auto flex w-full max-w-3xl flex-wrap items-center justify-between gap-x-5 gap-y-2 px-4 py-6 text-sm text-muted-foreground">
        <span>Checks run on GitHub, outside our server.</span>
        <a href="https://github.com/logfolio-co/status" class="hover:text-foreground">Powered by Upptime</a>
      </div>
    </footer>

    <script src="/app.js" defer></script>
  </body>
</html>
