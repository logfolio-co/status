# Logfolio's status page (status.logfolio.co), run by Upptime on GitHub
# Actions: checks from outside our server every 5 minutes, so it still
# works when the VPS is down. A site that fails opens an issue (GitHub
# emails the assignees) and closes it when the site is back.
owner: logfolio-co
repo: status

sites:
  # The homepage: the app answers at all.
  - name: Website
    url: https://logfolio.co/
  # A public profile: the app reads the database.
  - name: Profiles
    url: https://logfolio.co/naeem/
  - name: Help center
    url: https://help.logfolio.co/

# GitHub usernames to assign (and email) when a site goes down.
assignees:
  - naeemnur

status-website:
  cname: status.logfolio.co
  logoUrl: https://logfolio.co/icon.svg
  favicon: https://logfolio.co/icon.svg
  faviconSvg: https://logfolio.co/icon.svg
  name: Logfolio Status
  introTitle: "Is Logfolio up?"
  introMessage: "Live checks of logfolio.co every 5 minutes, from outside our server. If something looks wrong and this page says it's up, email hello@logfolio.co."
  navbar:
    - title: Status
      href: /
    - title: Logfolio
      href: https://logfolio.co/
    - title: Help
      href: https://help.logfolio.co/
